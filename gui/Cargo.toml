[package]
name = "debian-tools-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
tokio = { version = "1", features = ["process", "fs", "rt-multi-thread", "sync", "io-util", "time", "macros"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

rust-embed = { version = "8.0", features = ["debug-embed"] }
tempfile = "3.8"
